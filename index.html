<!DOCTYPE html>
<html lang="en">

<head>
    <title>Ye Ole Hairy Eyeball</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width"/>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script type="text/javascript" src="js/KRGameLoop.js"></script>
    <script type="text/javascript">

      var radius;
      var baseOffset;
      var dataPoints;
      var spacing;
      var animation;

      var from = 'BTC';
      var to = 'USDT';
      var interval = 'minute';
      var aggregate = 5;
      var gdata;
      var vseed;
      var timeouts = [];

      // caveat this was written in like ten seconds but I'll try to explain it...

      // pull data from an api of your choosing...
      // Binance is keyless and CORS-enabled. api.binance.com works globally
      // except in geoblocked regions (e.g. the US, HTTP 451), where api.binance.us
      // serves the same format, so we try .com first and fall back to .us.
      function load() {

        // interval maps to Binance's suffix (minute -> m, hour -> h, day -> d)
        // combined with aggregate; symbol is the two currencies joined.
        var suffix = { minute: 'm', hour: 'h', day: 'd' }[interval] || 'm';
        var query = "/api/v3/klines?symbol=" + from + to + "&interval=" + aggregate + suffix + "&limit=200";
        var hosts = ["https://api.binance.com", "https://api.binance.us"];

        function attempt(i) {
          if (i >= hosts.length) {
            drawMessage("Couldn't load market data.", "The data source may be unavailable or blocked in your region.");
            return;
          }
          var xmlHttp = new XMLHttpRequest();
          xmlHttp.onreadystatechange = function () {
            if (xmlHttp.readyState !== 4) return;
            if (xmlHttp.status === 200) {
              wtf(xmlHttp.responseText);
              init();
            } else {
              console.error("data load failed from " + hosts[i] + ": HTTP " + xmlHttp.status, xmlHttp.responseText);
              attempt(i + 1);
            }
          };
          xmlHttp.onerror = function () {
            console.error("network error loading from " + hosts[i]);
            attempt(i + 1);
          };
          xmlHttp.open("GET", hosts[i] + query, true); // true for asynchronous
          xmlHttp.send(null);
        }

        attempt(0);
      }

      // draw a readable message on the canvas instead of leaving it blank
      function drawMessage(title, detail) {
        var c = document.getElementById("canvas2");
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffe";
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.fillStyle = "#000";
        ctx.textAlign = "center";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(title, ctx.canvas.width / 2, ctx.canvas.height / 2 - 10);
        if (detail) {
          ctx.font = "14px sans-serif";
          ctx.fillText(detail, ctx.canvas.width / 2, ctx.canvas.height / 2 + 16);
        }
      }

      // capture the data and get started
      function wtf(dataRaw) {
        // Binance klines are arrays: [openTime, open, high, low, close, volume, ...]
        var parsed = JSON.parse(dataRaw).map(function (k) {
          return { close: Number(k[4]), volumefrom: Number(k[5]) };
        });
        parsed.reverse();
        drawCanvas2(parsed);
      }


      function drawCanvas2(data) {

        // set some defaults
        gdata = data;
        if (!baseOffset) baseOffset = -90;
        if (!vseed) vseed = 2;
        if (!radius) radius = 120;
        if (!dataPoints) dataPoints = 120;
        if (!spacing) spacing = 2;
        if (!animation) animation = 50;

        // build our canvas object
        // https://stackoverflow.com/questions/32681610/drawing-point-on-circle
        var c = document.getElementById("canvas2");
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffe";
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

        // make a new array of differences
        var previousClose = data[0].close;
        var diffs = [];
        var attitude = [];

        // some maths for sng's
        for (var i = 0; i < data.length; i++) {
          var diff = data[i].close - previousClose;
          diffs.push(diff);
          if (data[i].close > previousClose) attitude.push(true);
          else attitude.push(false);
          previousClose = data[i].close;
        }

        var hhd = Max(diffs);
        var lld = Min(diffs);
        var volume = [];
        for (var i = 0; i < data.length; i++) {
          volume.push(data[i].volumefrom);
        }
        var hhv = Max(volume);
        var llv = Min(volume);

        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 1.5;
        lastStroke = "";
        x = animation; // refactor me lol

        for (var i = dataPoints; i > 0; i--) {
          var offset = scaleRange2(lld, hhd, radius, baseOffset - diffs[i]);
          if (attitude[i]) {
            ctx.strokeStyle = '#ee0000';
          } else {
            offset = offset * -1;
            ctx.strokeStyle = '#00aa00';
          }

          var volumeLength = scaleRange2(llv, hhv, vseed, data[i].volumefrom);
          var angle = i * spacing;
          lastStroke = ctx.strokeStyle;

          // doppler loop it
          x = Number(x) + Number(animation);
          var time = setTimeout(function (a, b, c, d) {
              ctx.strokeStyle = d;
              drawLine(a, ctx, b + 1, c);
            },
            x,
            angle, volumeLength, offset, ctx.strokeStyle);
          timeouts.push(time);
        }

        time = setTimeout(function () {
          drawCanvas2(data);
        }, dataPoints * Number(animation) + 500);

        timeouts.push(time);
        ctx.strokeStyle = '#000000';

        drawCircle(ctx);
        if (!lastStroke) lastStroke = "#ff00ff";

        // triangle
        var pointx = ctx.canvas.width / 2 + Number(radius);
        var pointy = ctx.canvas.height / 2;
        ctx.fillStyle = lastStroke;
        ctx.beginPath();
        ctx.moveTo(pointx, pointy);
        ctx.lineTo(pointx - 10, pointy - 5);
        ctx.lineTo(pointx - 10, pointy + 5);
        ctx.fill();

        // heading
        ctx.fillStyle = "#000";
        var comparison = 'Comparing Volume with Relative Gain';
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = 'end';
        ctx.fillText(comparison, ctx.canvas.width - 10, ctx.canvas.height - 100);

        var description = 'Longer Lines: Higher Volume, Forward Leaning, Positive Difference';
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = 'end';
        ctx.fillText(description, ctx.canvas.width - 10, ctx.canvas.height - 85);

        var label = from + '/' + to + " " + aggregate + interval;
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = 'end';
        ctx.fillText(label, ctx.canvas.width - 10, ctx.canvas.height - 70);

        var method = 'length: volume, offset: relative gain from previous candle';
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = 'end';
        ctx.fillText(method, ctx.canvas.width - 10, ctx.canvas.height - 55);

        var color = 'green: positive gain, red: negative gain';
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = 'end';
        ctx.fillText(color, ctx.canvas.width - 10, ctx.canvas.height - 40);

        var identity = 'Keny Ruyter 2018';
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = 'end';
        ctx.fillText(identity, ctx.canvas.width - 10, ctx.canvas.height - 25);

      }

      function init() {

        var slider = document.getElementById("myRange");
        var output = document.getElementById("value");
        output.innerHTML = slider.value; // Display the default slider value
        // Update the current slider value (each time you drag the slider handle)
        slider.oninput = function () {
          for (var i = 0; i < timeouts.length; i++) {
            clearTimeout(timeouts[i]);
          }
          baseOffset = this.value;
          output.innerHTML = this.value;
          timeouts = [];
          drawCanvas2(gdata);
        };

        var vseedSlider = document.getElementById("vseed");
        var vseedLabel = document.getElementById("vseedLabel");
        vseedLabel.innerHTML = vseedSlider.value / 10;
        vseedSlider.oninput = function () {
          for (var i = 0; i < timeouts.length; i++) {
            clearTimeout(timeouts[i]);
          }
          vseed = this.value / 10;
          vseedLabel.innerHTML = this.value / 10;
          timeouts = [];
          drawCanvas2(gdata);
        };

        var radiusSlider = document.getElementById("radius");
        var radiusLabel = document.getElementById("radiusLabel");
        radiusLabel.innerHTML = radiusSlider.value;
        radiusSlider.oninput = function () {
          for (var i = 0; i < timeouts.length; i++) {
            clearTimeout(timeouts[i]);
          }
          radius = this.value;
          radiusLabel.innerHTML = this.value;
          timeouts = [];
          drawCanvas2(gdata);
        };

        var pointsSlider = document.getElementById("points");
        var pointsLabel = document.getElementById("pointsLabel");
        pointsLabel.innerHTML = pointsSlider.value;
        pointsSlider.oninput = function () {
          for (var i = 0; i < timeouts.length; i++) {
            clearTimeout(timeouts[i]);
          }
          dataPoints = this.value;
          pointsLabel.innerHTML = this.value;
          timeouts = [];
          drawCanvas2(gdata);
        };

        var spacingSlider = document.getElementById("spacing");
        var spacingLabel = document.getElementById("spacingLabel");
        spacingLabel.innerHTML = spacingSlider.value + "&deg;";
        spacingSlider.oninput = function () {
          for (var i = 0; i < timeouts.length; i++) {
            clearTimeout(timeouts[i]);
          }
          spacing = this.value;
          spacingLabel.innerHTML = this.value + "&deg;";
          timeouts = [];
          drawCanvas2(gdata);
        };

        var animationSlider = document.getElementById("animation");
        var animationLabel = document.getElementById("animationLabel");
        animationLabel.innerHTML = animationSlider.value;
        animationSlider.oninput = function () {
          for (var i = 0; i < timeouts.length; i++) {
            clearTimeout(timeouts[i]);
          }
          animation = this.value;
          animationLabel.innerHTML = this.value;
          timeouts = [];
          drawCanvas2(gdata);
        }
      }

      function drawCircle(ctx) {
        var center_x = ctx.canvas.width / 2;
        var center_y = ctx.canvas.height / 2;
        ctx.beginPath();
        ctx.arc(center_x, center_y, radius, 0, 2 * Math.PI);
        ctx.stroke();

      }

      function drawLine(angle, ctx, distance, offset) {
        var center_x = ctx.canvas.width / 2;
        var center_y = ctx.canvas.height / 2;
        var x = center_x + radius * Math.cos(-angle * Math.PI / 180);
        var y = center_y + radius * Math.sin(-angle * Math.PI / 180);
        ctx.beginPath();
        ctx.moveTo(x, y);
        var aOff = angle + offset;
        var x2 = center_x + radius * Math.cos(-aOff * Math.PI / 180) * distance;
        var y2 = center_y + radius * Math.sin(-aOff * Math.PI / 180) * distance;
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.strokeStyle = '#0000ff';
      }

      function scaleRange2(ll, hh, range, y) {
        return range * (1 - (y - hh) / (ll - hh));
      }

      function Max(array) {
        return Math.max.apply(Math, array);
      }

      function Min(array) {
        return Math.min.apply(Math, array);
      }


    </script>

</head>

<body bgcolor="#FFFFFF" onLoad="load();">
<br>
<center>

    <canvas id="canvas2" width="900" height="500"></canvas>

    <div class="controls">

        <div class="row" title="Angular lean added to every line. Negative points them inward toward the circle; positive swings them outward.">
            <span class="name">Base Offset</span>
            <span class="end left">Inside</span>
            <input type="range" min="-200" max="200" value="-90" class="slider" id="myRange">
            <span class="end right">Outside</span>
            <span class="val" id="value"></span>
        </div>

        <div class="row" title="Scales each line's length by trading volume. Higher makes high-volume lines longer; negative flips lines inward.">
            <span class="name">Volume Seed Length</span>
            <span class="end left">Shorter</span>
            <input type="range" min="-100" max="100" value="20" class="slider" id="vseed">
            <span class="end right">Longer</span>
            <span class="val" id="vseedLabel"></span>
        </div>

        <div class="row" title="Size of the base circle the lines radiate from.">
            <span class="name">Radius</span>
            <span class="end left">Smaller</span>
            <input type="range" min="1" max="240" value="120" class="slider" id="radius">
            <span class="end right">Bigger</span>
            <span class="val" id="radiusLabel"></span>
        </div>

        <div class="row" title="How many candles (lines) are drawn.">
            <span class="name">Number of Points</span>
            <span class="end left">Fewer</span>
            <input type="range" min="1" max="200" value="120" class="slider" id="points">
            <span class="end right">More</span>
            <span class="val" id="pointsLabel"></span>
        </div>

        <div class="row" title="Degrees between each line. Whole divisors of 360 stack the points into clusters — 90&deg; gives 4, 72&deg; gives 5, 60&deg; gives 6, and so on.">
            <span class="name">Linear Distribution</span>
            <span class="end left">Tight fan</span>
            <input type="range" min="1" max="180" value="2" class="slider" id="spacing">
            <span class="end right">Full circle</span>
            <span class="val" id="spacingLabel"></span>
        </div>

        <div class="row" title="Delay between drawing each line. Left is faster, right is slower.">
            <span class="name">Animation Speed</span>
            <span class="end left">Faster</span>
            <input type="range" min="1" max="100" value="50" class="slider" id="animation">
            <span class="end right">Slower</span>
            <span class="val" id="animationLabel"></span>
        </div>

    </div>

</center>
</body>
</html>
